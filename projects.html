<script>
  document.documentElement.classList.add('js');
  try { var t = localStorage.getItem('tn-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
  :root {
    --bg: #ffffff; --bg2: #f5f5f5; --ink: #1a1a1a; --muted: #767676; --line: rgba(0,0,0,.08); --line2: rgba(0,0,0,.2);
    --btn: #000000; --btnfg: #ffffff;
    --chip: #1d1d1d; --chipfg: #ffffff; --chipline: rgba(255,255,255,.14);
    --card: #ffffff; --shadow: 0 18px 40px -18px rgba(0,0,0,.28);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e; --bg2: #171717; --ink: #f1f1f1; --muted: #8f8f8f; --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.22);
      --btn: #ffffff; --btnfg: #000000;
      --chip: #2b2b2b; --chipline: rgba(255,255,255,.16); --card: #202020; --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0e0e; --bg2: #171717; --ink: #f1f1f1; --muted: #8f8f8f; --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.22);
    --btn: #ffffff; --btnfg: #000000;
    --chip: #2b2b2b; --chipline: rgba(255,255,255,.16); --card: #202020; --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }

  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-behavior: smooth; scroll-padding-top: calc(76px + env(safe-area-inset-top, 0px)); overflow-x: clip; }
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  body {
    min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: clip;
  }
  a { color: inherit; text-decoration: none; }
  /* no blue flash / selection highlight when tapping buttons and links on touch screens */
  html, body, * { -webkit-tap-highlight-color: transparent; }
  a, button, .btn, [role="button"], [role="switch"] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid #ff5a2c; outline-offset: 3px; border-radius: 6px; }

  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) { z-index: 2; }
  .theming, .theming *, .theming *::before, .theming *::after { transition: background-color .9s ease, color .9s ease, border-color .9s ease, fill .9s ease, stroke .9s ease, box-shadow .9s ease !important; }

  /* ---------- Header ---------- */
  .top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 10; border-bottom: 1px solid transparent; transition: background-color .5s, border-color .5s, backdrop-filter .5s; }
  .top.scrolled { background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom-color: var(--line); }
  .top-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; max-width: 1240px; margin: 0 auto; padding: 28px 56px; font-size: 15px; letter-spacing: -.01em; transition: padding .5s; }
  .top.scrolled .top-in { padding-top: 18px; padding-bottom: 18px; }
  .top .logo { justify-self: start; font-size: 22px; font-weight: 700; letter-spacing: -.05em; line-height: 1; display: inline-flex; align-items: baseline; }
  .top .logo .rest { display: inline-grid; grid-template-columns: 0fr; transition: grid-template-columns .7s cubic-bezier(.2,.8,.2,1); }
  .top .logo .rest > span { min-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; padding-bottom: .25em; margin-bottom: -.25em; transition: opacity .5s ease; }
  .top .logo:hover .rest, .top .logo:focus-visible .rest { grid-template-columns: 1fr; }
  .top .logo:hover .rest > span, .top .logo:focus-visible .rest > span { opacity: 1; }
  .top nav { display: flex; gap: 36px; }
  .top nav a { opacity: .6; transition: opacity .3s; }
  .top nav a:hover { opacity: 1; }
  .top nav a.has-scrib { position: relative; }
  .dz { display: inline-grid; align-items: baseline; }
  .dz > span { grid-area: 1 / 1; }
  .dh { width: 0; justify-self: center; display: flex; justify-content: center; white-space: nowrap; font-family: "Gochi Hand", "Comic Sans MS", "Chalkboard SE", cursive; font-size: 19px; line-height: 1; letter-spacing: .01em; opacity: 0; }
  .has-scrib:hover .dh, .has-scrib:focus-visible .dh { opacity: 1; }
  .has-scrib:hover .dn, .has-scrib:focus-visible .dn { opacity: 0; }
  .scrib { position: absolute; left: 50%; top: 50%; width: 72px; max-width: none; height: auto; transform: translate(-50%, -50%) rotate(-3deg); pointer-events: none; opacity: 0; transition: none; }
  .top nav a.has-scrib:hover .scrib, .top nav a.has-scrib:focus-visible .scrib { opacity: 1; }
  :root[data-theme="dark"] .scrib { filter: invert(1); }
  @media (max-width: 700px) { .top-in { padding: 20px; } .top.scrolled .top-in { padding: 14px 20px; } .top nav { gap: 20px; } }

  /* ---------- Lander ---------- */
  .mode { position: relative; display: block; width: 44px; height: 44px; margin: 0 0 14px -11px; border: 0; border-radius: 50%; background: none; color: var(--ink); cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; }
  .mode svg { position: absolute; inset: 0; margin: auto; width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform .7s cubic-bezier(.65,0,.2,1), opacity .4s; }
  .mode .moon { opacity: 0; transform: rotate(-90deg) scale(.4); }
  :root[data-theme="dark"] .mode .sun { opacity: 0; transform: rotate(90deg) scale(.4); }
  :root[data-theme="dark"] .mode .moon { opacity: 1; transform: none; }

  .lander { width: 100%; max-width: 1240px; margin: 0 auto; padding: 96px 56px 64px; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }

  h1 { font-size: clamp(42px, 7.2vw, 88px); line-height: 1.04; letter-spacing: -.048em; font-weight: 600; max-width: 14.5em; text-wrap: balance; }
  h1 .line { display: block; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
  .w > span { display: inline-block; }
  .js .w > span { transform: translateY(108%); animation: rise 1.1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(.2s + var(--d, 0) * .055s); }
  @keyframes rise { to { transform: none; } }

  .chip {
    display: inline-flex; align-items: center; justify-content: center; width: .9em; height: .9em; border-radius: .27em; vertical-align: top; margin: .13em .05em 0;
    background: var(--chip); color: var(--chipfg);
    box-shadow: 0 .16em .3em -.1em rgba(0,0,0,.45), inset 0 0 0 1px var(--chipline), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .chip svg { width: 52%; height: 52%; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .chip.me { background: #fff; box-shadow: 0 .16em .3em -.1em rgba(0,0,0,.35), 0 0 0 .05em #fff; overflow: hidden; }
  .chip.me img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .js .chip { opacity: 0; animation: pop .9s cubic-bezier(.2,1.3,.4,1) forwards; animation-delay: calc(.45s + var(--d, 0) * .07s); }
  @keyframes pop { from { opacity: 0; transform: scale(.45) rotate(-14deg); } to { opacity: 1; transform: none; } }

  .js .after { opacity: 0; animation: fadeup 1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(.95s + var(--a, 0) * .12s); }
  @keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .lede { margin-top: 28px; max-width: 46ch; font-size: 18px; color: var(--muted); }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 22px; border-radius: 12px; border: 1px solid transparent;
    background: var(--btn); color: var(--btnfg); font-weight: 500; font-size: 15px; white-space: nowrap; cursor: pointer;
    box-shadow: 0 14px 24px -14px rgba(0,0,0,.55); transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 20px 28px -14px rgba(0,0,0,.5); }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .btn:hover svg { transform: translateX(3px); }
  .btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line2); box-shadow: none; }

  /* ---------- Sections ---------- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 56px; }
  .block { border-top: 1px solid var(--line); padding: 112px 0; }
  .block h2 { font-size: clamp(34px, 4.6vw, 60px); line-height: 1.04; letter-spacing: -.045em; font-weight: 600; margin-bottom: 48px; }
  .js .rv { opacity: 0; transform: translateY(18px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
  .js .rv.in { opacity: 1; transform: none; }

  [hidden] { display: none !important; }
  .pgp { max-width: 1240px; margin: 0 auto; padding: 150px 56px 96px; min-height: calc(100svh - 90px); }
  .pgp .lede { margin-top: 24px; }
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 56px; }

<script>
(() => {
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s, c = document) => c.querySelector(s);
  const $$ = (s, c = document) => [...c.querySelectorAll(s)];

  // theme toggle (the choice is remembered between pages)
  const btn = $('#mode');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = isDark() ? 'dark' : 'light';
  const sync = () => btn.setAttribute('aria-checked', String(isDark()));
  sync();
  btn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    const apply = () => { root.dataset.theme = next; sync(); try { localStorage.setItem('tn-theme', next); } catch (e) {} };
    if (reduce || !document.startViewTransition) {
      root.classList.add('theming'); apply();
      setTimeout(() => root.classList.remove('theming'), 1000);
      return;
    }
    const b = btn.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top + b.height / 2;
    const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(apply).ready.then(() => {
      root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${(r * 1.25).toFixed(0)}px at ${x}px ${y}px)`] },
        { duration: 1100, easing: 'cubic-bezier(.45,0,.25,1)', pseudoElement: '::view-transition-new(root)' });
    }).catch(() => {});
  });

  // header gets a background once you scroll
  const bar = $('#topbar');
  const onScroll = () => bar.classList.toggle('scrolled', scrollY > 24);
  onScroll(); addEventListener('scroll', onScroll, { passive: true });

  // mobile menu: the links collapse into a button at the right of the header
  (function () {
    const tb = $('#topbar'), mb = $('#menuBtn');
    if (!tb || !mb) return;
    const setMenu = open => { tb.classList.toggle('open', open); mb.setAttribute('aria-expanded', String(open)); mb.setAttribute('aria-label', open ? 'Close menu' : 'Open menu'); };
    mb.addEventListener('click', e => { e.stopPropagation(); setMenu(!tb.classList.contains('open')); });
    document.addEventListener('click', e => { if (tb.classList.contains('open') && !e.target.closest('nav')) setMenu(false); });
    $$('nav a', tb).forEach(a => a.addEventListener('click', () => setMenu(false)));
    addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
    matchMedia('(min-width: 701px)').addEventListener('change', e => { if (e.matches) setMenu(false); });
  })();

  // reveal on scroll
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -6% 0px' });
  $$('.rv').forEach(el => io.observe(el));
})();
</script>
</body>
</html>
