<meta name="description" content="Design, by Toby Nash.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Gochi+Hand&amp;display=swap" rel="stylesheet">
<style>
  :root { --bg: #ffffff; --ink: #1a1a1a; --muted: #767676; --line: rgba(0,0,0,.08); }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  img { max-width: 100%; }
  :focus-visible { outline: 2px solid #ff5a2c; outline-offset: 3px; border-radius: 6px; }
  main { flex: 1; }

  /* header: the drawn face on the left, the links in the middle */
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; border-bottom: 1px solid transparent; transition: background-color .5s, border-color .5s, backdrop-filter .5s; }
  .top.scrolled { background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom-color: var(--line); }
  .top-in { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; max-width: 1240px; margin: 0 auto; padding: 20px 56px; font-size: 15px; letter-spacing: -.01em; transition: padding .5s; }
  .top.scrolled .top-in { padding-top: 14px; padding-bottom: 14px; }
  .logo { justify-self: start; display: block; width: 48px; height: 48px; transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
  .logo img { display: block; width: 100%; height: 100%; }
  .logo:hover { transform: rotate(-8deg) scale(1.06); }
  .top nav { display: flex; gap: 36px; }
  .top nav a { position: relative; opacity: .6; transition: opacity .3s; }
  .top nav a:hover { opacity: 1; }
  .top nav a.has-scrib { position: relative; }
  .dz { display: inline-grid; align-items: baseline; }
  .dz > span { grid-area: 1 / 1; }
  .dh { width: 0; justify-self: center; display: flex; justify-content: center; white-space: nowrap; font-family: "Gochi Hand", "Comic Sans MS", "Chalkboard SE", cursive; font-size: 19px; line-height: 1; letter-spacing: .01em; opacity: 0; }
  .has-scrib:hover .dh, .has-scrib:focus-visible .dh { opacity: 1; }
  .has-scrib:hover .dn, .has-scrib:focus-visible .dn { opacity: 0; }
  .scrib { position: absolute; left: 50%; top: 50%; width: 72px; max-width: none; height: auto; transform: translate(-50%, -50%) rotate(-3deg); pointer-events: none; opacity: 0; transition: none; }
  .top nav a.has-scrib:hover .scrib, .top nav a.has-scrib:focus-visible .scrib { opacity: 1; }
  .secret { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-size: 11px; line-height: 1; color: var(--bg); pointer-events: none; }
  /* "Development Stuff": just green code running over the text when you hover it */
  .dev { justify-self: end; position: relative; display: inline-block; padding: 2px 6px; margin: -2px -6px -2px 0; overflow: hidden; opacity: .6; transition: opacity .3s; }
  .dev:hover, .dev:focus-visible { opacity: 1; }
  .dev .dv-t { position: relative; transition: color .25s; }
  .dev:hover .dv-t, .dev:focus-visible .dv-t { color: #0b7d37; }
  .dev-m { display: none; }
  .rain { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .dev:hover .rain, .dev:focus-visible .rain { opacity: 1; }
  .menu-btn { display: none; position: relative; width: 44px; height: 44px; margin-right: -10px; padding: 0; border: 0; background: none; cursor: pointer; justify-self: end; -webkit-tap-highlight-color: transparent; }
  .menu-btn span { position: absolute; left: 11px; width: 22px; height: 2px; border-radius: 2px; background: var(--ink); transition: transform .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1); }
  .menu-btn span:nth-child(1) { top: 17px; } .menu-btn span:nth-child(2) { top: 25px; }
  .top.open .menu-btn span:nth-child(1) { top: 21px; transform: rotate(45deg); }
  .top.open .menu-btn span:nth-child(2) { top: 21px; transform: rotate(-45deg); }

  /* footer: the drawn icons, a straight line above, the place in the normal font */
  .foot { position: relative; padding: 22px 0 16px; background: var(--bg); }
  .foot::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--ink); }
  .foot-in { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 1240px; margin: 0 auto; padding: 0 56px; }
  .icons { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .ib { display: block; width: 36px; height: 36px; padding: 0; border: 0; background: none; cursor: pointer; transition: transform .45s cubic-bezier(.3,1.6,.5,1); -webkit-tap-highlight-color: transparent; }
  .ib:nth-child(1) { transform: rotate(-5deg); } .ib:nth-child(2) { transform: rotate(4deg); } .ib:nth-child(3) { transform: rotate(-3deg); }
  .ib:hover { transform: rotate(0deg) scale(1.16) translateY(-4px); }
  .ib svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(1.5px 2px 0 rgba(28,27,34,.9)); }
  .ib svg * { stroke: #1c1b22; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .ib svg path:not([fill]) { fill: none; }
  .loc { font-size: 12.5px; line-height: 1; color: var(--muted); letter-spacing: -.01em; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
  @media (max-width: 700px) {
    .foot-in { padding: 0 22px; }
    .top-in, .top.scrolled .top-in { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; }
    .logo { width: 44px; height: 44px; }
    .menu-btn { display: block; }
    .top.open { background: var(--bg); border-bottom-color: var(--line); }
    .top nav { position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; gap: 0; padding: 0 20px; max-height: 0; overflow: hidden; opacity: 0; visibility: hidden; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 22px 30px -24px rgba(0,0,0,.25); transition: max-height .45s cubic-bezier(.2,.8,.2,1), opacity .3s, padding .45s, visibility 0s .45s; }
    .top.open nav { max-height: 380px; opacity: 1; visibility: visible; padding: 4px 20px 14px; transition: max-height .45s cubic-bezier(.2,.8,.2,1), opacity .3s, padding .45s; }
    .top nav a, .top nav a.has-scrib { display: block; font-size: 21px; letter-spacing: -.03em; padding: 15px 0; border-bottom: 1px solid var(--line); opacity: 1; }
    .top nav a:last-child { border-bottom: 0; }
    .top nav a.has-scrib .scrib, .top nav a.has-scrib .dh { display: none; }
    .top nav a.has-scrib:hover .dn { opacity: 1; }
    .dev { display: none; } .top nav a.dev-m { display: block; }
    .ib { width: 34px; height: 34px; }
  }
</style>
</head>

    }
    function frame() {
      ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(0, 0, w, h);      // fade the trails
      ctx.globalCompositeOperation = 'source-over'; ctx.font = '600 ' + SZ + 'px "Courier New", monospace';
      cols.forEach((c, i) => {
        ctx.fillStyle = 'rgba(8,128,52,.85)'; ctx.fillText(glyphs[(Math.random() * glyphs.length) | 0], i * SZ, c.y);
        ctx.fillStyle = 'rgba(24,196,92,.5)'; ctx.fillText(glyphs[(Math.random() * glyphs.length) | 0], i * SZ, c.y - SZ);
        c.y += c.v * 1.8;
        if (c.y > h + SZ * 2 && Math.random() > .9) { c.y = -SZ; c.v = .8 + Math.random() * 1.4; }
      });
      raf = requestAnimationFrame(frame);
    }
    const start = () => { if (reduce || raf) return; size(); raf = requestAnimationFrame(frame); };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; setTimeout(() => { if (!raf) ctx.clearRect(0, 0, w, h); }, 300); };
    link.addEventListener('mouseenter', start); link.addEventListener('mouseleave', stop);
    link.addEventListener('focus', start); link.addEventListener('blur', stop);
  })();
  // mobile menu
  const mb = $('#menuBtn');
  const setMenu = open => { bar.classList.toggle('open', open); mb.setAttribute('aria-expanded', String(open)); mb.setAttribute('aria-label', open ? 'Close menu' : 'Open menu'); };
  mb.addEventListener('click', e => { e.stopPropagation(); setMenu(!bar.classList.contains('open')); });
  document.addEventListener('click', e => { if (bar.classList.contains('open') && !bar.contains(e.target)) setMenu(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  addEventListener('resize', () => { if (innerWidth > 700) setMenu(false); });
})();
</script>
</body>
